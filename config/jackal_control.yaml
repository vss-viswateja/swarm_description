/**:
    controller_manager:
      ros__parameters:
        update_rate: 50

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster
        
        diff_drive_controller:
          type: diff_drive_controller/DiffDriveController

    diff_drive_controller:
      ros__parameters: 
        left_wheel_names: ["front_left_wheel", "rear_left_wheel"]
        right_wheel_names: ["front_right_wheel", "rear_right_wheel"]
        #default wheel seperation 0.37558
        wheel_separation: 0.37558
        #default wheel radius 0.098
        wheel_radius: 0.098
        wheels_per_side: 2

        # Skid-steer correction multipliers (critical for 4-wheel robots)
        # Angular velocity is halved in diff_drive_controller for skid-steer
        wheel_separation_multiplier: 1.0
        wheel_radius_multiplier: 1.0

        odom_frame_id: "odom"
        base_frame_id: "base_link"

        # Covariance settings for EKF fusion
        pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
        twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

        use_stamped_vel: false
        enable_odom_tf: false




