/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      # Joint State Broadcaster
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      # Jackal Diff Drive Controller
      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController

      # UR5 Arm Joint Trajectory Controller
      mobman_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  # Jackal Differential Drive Controller Configuration
  diff_drive_controller:
    ros__parameters:
      left_wheel_names: ["front_left_wheel", "rear_left_wheel"]
      right_wheel_names: ["front_right_wheel", "rear_right_wheel"]

      wheels_per_side: 1
      wheel_separation: 0.37559
      wheel_radius: 0.098

      wheel_separation_multiplier: 1.0
      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      publish_rate: 50.0
      odom_frame_id: "odom"
      base_frame_id: "base_link"
      # Covariance values - tuned for skidding/slipping
      # Increased X/Y (0.2) to account for linear drift during rotation
      # Increased Yaw (0.3) to account for rotational slip
      pose_covariance_diagonal: [0.1, 0.1, 0.05, 0.05, 0.05, 0.1]
      twist_covariance_diagonal: [0.2, 0.2, 0.05, 0.05, 0.05, 0.3]

      enable_odom_tf: false
      use_stamped_vel: false


  # UR5 Arm Joint Trajectory Controller Configuration
  mobman_arm_controller:
    ros__parameters:
      joints:
        - arm_base_link1_joint
        - arm_link1_link2p1_joint
        - arm_link2p3_link3_joint
        - arm_link3_link4_joint
        - arm_link4_link5_joint
        - arm_link5_link6_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity